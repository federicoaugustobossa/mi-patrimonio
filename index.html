<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Patrimonio</title>
<meta name="description" content="Gastos, cuentas, presupuestos y patrimonio personal.">
<meta name="theme-color" content="#f3f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1311" media="(prefers-color-scheme: dark)">
<!-- iPhone: app a pantalla completa desde "Agregar a inicio" -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patrimonio">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main><div class="wrap" id="view"></div></main>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"
  onerror="var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.crossOrigin='anonymous';s.onload=function(){window.__sbReady&&window.__sbReady()};document.head.appendChild(s);this.dataset.failed='1'"></script>
<script>
  // Arranca la app cuando la librería de Supabase está lista (CDN principal o alternativo)
  (function boot(){
    function go(){var t=document.createElement('script');t.src='/app.js?v=1';document.body.appendChild(t);}
    if(window.supabase){go();return;}
    window.__sbReady=go;
    setTimeout(function(){if(!window.supabase&&!document.querySelector('script[src="/app.js?v=1"]')){
      document.getElementById('view').innerHTML='<div class="card empty"><h3>No se pudo cargar la app</h3><p>Revisá tu conexión a internet y volvé a abrirla.</p></div>';}},12000);
  })();
</script>
</body>
</html>
